<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --sky: #DCEBFF; --ink: #2B2560; --pink: #FF8FC0; --lemon: #FFD84D; --white: #FFFFFF; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 600; color: var(--ink);
    background: var(--sky) radial-gradient(rgba(43, 37, 96, .09) 1.6px, transparent 1.7px) 0 0 / 22px 22px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 24px; display: grid; grid-template-columns: 1fr auto; gap: 48px; align-items: start; }

  h1 { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; font-size: clamp(2.6rem, 7vw, 4.4rem); font-weight: 800; line-height: 1; }
  h1 svg { width: .8em; height: .8em; flex: none; }
  .subtitle { margin: 0 0 36px; font-size: 1.25rem; line-height: 1.4; max-width: 40ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 28px; }
  .tile { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--white); border: 4px solid var(--ink); border-radius: 50% 50% 26px 26px / 80px 80px 26px 26px; overflow: hidden; box-shadow: 0 6px 0 var(--ink); transition: transform .15s ease; }
  .tile:hover { transform: translateY(-4px) rotate(-1.5deg); }
  .tile:focus-visible { outline: 4px dashed var(--ink); outline-offset: 6px; }
  .tile-top { height: 120px; background: var(--c); border-bottom: 4px solid var(--ink); display: grid; place-items: center; font-size: 3.4rem; padding-top: 10px; }
  .tile-body { flex: 1; padding: 12px 16px 18px; text-align: center; }
  .tile h2 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 800; line-height: 1.1; }
  .tile p { margin: 0; font-size: 1rem; line-height: 1.35; opacity: .8; }

  .picker { display: flex; flex-direction: column; align-items: center; width: 240px; padding-top: 8px; }
  .machine { background: none; border: 0; padding: 0; cursor: pointer; width: 100%; border-radius: 24px; }
  .machine:disabled { cursor: wait; }
  .machine:focus-visible { outline: 4px dashed var(--ink); outline-offset: 8px; }
  .machine svg { display: block; width: 100%; height: auto; }
  #knob { transform-box: fill-box; transform-origin: center; transition: transform .6s cubic-bezier(.3, 1.4, .5, 1); }
  .machine:hover:not(:disabled) #knob { transform: rotate(-20deg); }
  .ball-inner { transform-box: fill-box; transform-origin: center; }
  .shaking .ball-inner { animation: jiggle .6s ease-in-out; }
  @keyframes jiggle {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-3px, -5px) rotate(-14deg); }
    50% { transform: translate(3px, -2px) rotate(10deg); }
    75% { transform: translate(-2px, -4px) rotate(-6deg); }
  }

  .prize { min-height: 110px; width: 100%; display: flex; justify-content: center; align-items: flex-start; padding-top: 14px; }
  .prize-hint { margin: 0; opacity: .7; }
  .ball { width: 60px; height: 60px; border-radius: 50%; border: 4px solid var(--ink); overflow: hidden; display: flex; flex-direction: column; animation: drop .7s ease-out both; }
  .ball span { flex: 1; }
  .ball .top { background: var(--c); border-bottom: 4px solid var(--ink); }
  .ball .bottom { background: var(--white); }
  @keyframes drop {
    0% { transform: translateY(-70px) scale(.6); opacity: 0; }
    50% { transform: translateY(0) scale(1); opacity: 1; }
    72% { transform: translateY(-14px); }
    100% { transform: translateY(0); }
  }
  .prize-card { display: flex; gap: 12px; align-items: center; width: 100%; text-decoration: none; color: inherit; background: var(--white); border: 4px solid var(--ink); border-radius: 999px; padding: 6px 18px 6px 6px; box-shadow: 0 5px 0 var(--ink); animation: pop .35s cubic-bezier(.3, 1.5, .5, 1) both; }
  .prize-card:focus-visible { outline: 4px dashed var(--ink); outline-offset: 4px; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .prize-icon { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--c); border: 4px solid var(--ink); display: grid; place-items: center; font-size: 1.6rem; }
  .prize-card strong { font-size: 1.25rem; font-weight: 800; line-height: 1.1; }

  @media (max-width: 720px) {
    .wrap { grid-template-columns: 1fr; gap: 24px; padding-top: 32px; }
    .picker { justify-self: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h1>
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="16" fill="#fff" stroke="#2B2560" stroke-width="4"/>
        <path d="M4 20 A16 16 0 0 1 36 20 Z" fill="#FF8FC0" stroke="#2B2560" stroke-width="4" stroke-linejoin="round"/>
      </svg>
      games
    </h1>
    <p class="subtitle">Phone games I play that won't let me pay the ads away. Mostly built with robots.</p>
    <div class="grid" id="grid"></div>
  </div>

  <div class="picker">
    <button class="machine" id="machine" aria-label="Pick a random game">
      <svg viewBox="0 0 260 380" aria-hidden="true">
        <rect x="100" y="8" width="60" height="24" rx="9" fill="#FF8FC0" stroke="#2B2560" stroke-width="4"/>
        <circle cx="130" cy="126" r="100" fill="#fff" fill-opacity=".55" stroke="#2B2560" stroke-width="4"/>
        <g id="balls"></g>
        <path d="M62 96 A72 72 0 0 1 104 50" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none"/>
        <rect x="62" y="212" width="136" height="20" rx="7" fill="#FFD84D" stroke="#2B2560" stroke-width="4"/>
        <rect x="40" y="228" width="180" height="128" rx="26" fill="#FF8FC0" stroke="#2B2560" stroke-width="4"/>
        <g id="knob">
          <circle cx="130" cy="272" r="25" fill="#FFD84D" stroke="#2B2560" stroke-width="4"/>
          <rect x="103" y="265" width="54" height="14" rx="7" fill="#fff" stroke="#2B2560" stroke-width="4"/>
        </g>
        <rect x="102" y="308" width="56" height="34" rx="11" fill="#2B2560"/>
        <rect x="60" y="354" width="34" height="18" rx="7" fill="#2B2560"/>
        <rect x="166" y="354" width="34" height="18" rx="7" fill="#2B2560"/>
      </svg>
    </button>
    <div class="prize" id="prize" aria-live="polite"><p class="prize-hint">spin for a random one</p></div>
  </div>
</main>

<script>
  // ✏️ Add new games here
  const GAMES = [
    { title: "Kweens",       emoji: "🐱", color: "#FF8FC0", url: "https://meowni.ca/games/kweens/", note: "it's like queens but with cats" }, // ✏️ add the Kweens link
    { title: "Eprubete",     emoji: "🧪", color: "#86E3C8", url: "https://meowni.ca/eprubete/", note: "it means test tube in romanian" },
    { title: "Score Keeper", emoji: "🏆", color: "#FFD84D", url: "https://meowni.ca/score-keeper/", note: "because we play spades in pubs and don't have paper" }
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  document.getElementById("grid").innerHTML = GAMES.map(g => `
    <a class="tile" href="${esc(g.url)}" style="--c:${esc(g.color)}">
      <div class="tile-top" aria-hidden="true">${g.emoji}</div>
      <div class="tile-body">
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.note)}</p>
      </div>
    </a>`).join("");

  // Capsules inside the dome
  const spots = [[60,142],[205,142],[82,172],[118,186],[155,188],[188,170],[100,208],[160,210],[98,140],[136,152],[172,138],[118,112],[152,108],[130,206]];
  document.getElementById("balls").innerHTML = spots.map(([x, y], i) => `
    <g transform="translate(${x} ${y}) rotate(${(i * 47) % 360})"><g class="ball-inner" style="animation-delay:${(i % 4) * 40}ms">
      <circle r="16" fill="#fff" stroke="#2B2560" stroke-width="3"/>
      <path d="M-16 0 A16 16 0 0 1 16 0 Z" fill="${GAMES[i % GAMES.length].color}" stroke="#2B2560" stroke-width="3" stroke-linejoin="round"/>
    </g></g>`).join("");

  // Random picker
  const machine = document.getElementById("machine");
  const knob = document.getElementById("knob");
  const prize = document.getElementById("prize");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let turns = 0, last = -1;

  const showCard = g => {
    prize.innerHTML = `<a class="prize-card" href="${esc(g.url)}" style="--c:${esc(g.color)}">
      <span class="prize-icon" aria-hidden="true">${g.emoji}</span><strong>${esc(g.title)}</strong></a>`;
  };

  machine.addEventListener("click", () => {
    let i;
    do { i = Math.floor(Math.random() * GAMES.length); } while (GAMES.length > 1 && i === last);
    last = i;
    const g = GAMES[i];
    if (reduceMotion) return showCard(g);

    machine.disabled = true;
    knob.style.transform = `rotate(${++turns * 360}deg)`;
    machine.classList.remove("shaking");
    void machine.offsetWidth;
    machine.classList.add("shaking");
    setTimeout(() => {
      prize.innerHTML = `<div class="ball" style="--c:${esc(g.color)}" aria-hidden="true"><span class="top"></span><span class="bottom"></span></div>`;
    }, 550);
    setTimeout(() => { showCard(g); machine.disabled = false; }, 1350);
  });
</script>
</body>
</html>
